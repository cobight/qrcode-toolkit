name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 页面部署不并发，避免两次部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      # 仅用于拿到本仓库在 Pages 上的 base_path（项目站点为 /<repo>）
      - id: pages
        uses: actions/configure-pages@v6

      - name: Resolve base URL
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="${BASE_PATH%/}"
          echo "NUXT_APP_BASE_URL=${base}/" >> "$GITHUB_ENV"
          echo "base url: ${base}/"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm run generate

      # GitHub Pages 默认用 Jekyll 处理，静态产物必须显式跳过
      - name: Disable Jekyll
        run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
